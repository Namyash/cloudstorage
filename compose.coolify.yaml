services:
  sparedrive:
    image: ${SPAREDRIVE_IMAGE:?Set SPAREDRIVE_IMAGE to your built image}
    environment:
      SPAREDRIVE_HOST_PORT: ${SPAREDRIVE_HOST_PORT:-18765}
      SPAREDRIVE_HTTPS_ORIGIN: ${SPAREDRIVE_HTTPS_ORIGIN:-}
      SPAREDRIVE_STORAGE_ID: ${SPAREDRIVE_STORAGE_ID:-}
    ports:
      - "127.0.0.1:${SPAREDRIVE_HOST_PORT:-18765}:8765"
    volumes:
      - type: bind
        source: ${SPAREDRIVE_DATA_DIR:?Set SPAREDRIVE_DATA_DIR to an existing folder on your data drive}
        target: /data
        bind:
          create_host_path: false
    labels:
      traefik.enable: "false"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f1">
  <meta name="description" content="Private storage on your family's own drive.">
  <title>SpareDrive</title>
  <link rel="icon" type="image/png" href="/assets/sparedrive-logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <div id="app">
    <div class="loading" role="status">
      <div class="loading-card">
        <img class="brand-icon" src="/assets/sparedrive-logo.png" width="48" height="48" alt="">
        <div class="loading-spinner" aria-hidden="true"></div>
        <strong>Opening SpareDrive…</strong>
        <span>Preparing your private household workspace</span>
      </div>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>

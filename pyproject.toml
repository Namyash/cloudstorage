[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "family-drive"
version = "0.2.1"
description = "Self-hosted household file storage on drives the administrator selects"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
sparedrive-remote = "family_drive.remote_setup:main"
sparedrive = "family_drive.host_server:main"
family-drive = "family_drive.host_server:main"

[tool.setuptools]
packages = ["family_drive", "family_drive.frontend"]
package-dir = {family_drive = "backend", "family_drive.frontend" = "frontend"}
include-package-data = false

[tool.setuptools.package-data]
"family_drive.frontend" = ["*.html", "*.css", "*.js", "sparedrive-logo.png"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

services:
  sparedrive:
    image: ${SPAREDRIVE_GATEWAY_IMAGE:-localhost:5000/sparedrive-windows-gateway:coolify-1}
    environment:
      SPAREDRIVE_GATEWAY_PORT: ${SPAREDRIVE_GATEWAY_PORT:-18765}
      SPAREDRIVE_NATIVE_PORT: ${SPAREDRIVE_NATIVE_PORT:-8765}
      SPAREDRIVE_HTTPS_HOST: ${SPAREDRIVE_HTTPS_HOST:-sparedrive.invalid}
    ports:
      - "127.0.0.1:${SPAREDRIVE_GATEWAY_PORT:-18765}:8080"
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null --header \"Host: 127.0.0.1:$$SPAREDRIVE_GATEWAY_PORT\" http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
